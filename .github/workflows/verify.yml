name: verify

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Opt in to a real StepFun API request (may incur charges); default is no request'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  fast:
    name: fast gate (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run fast gate
        id: gate
        continue-on-error: true
        run: |
          set -e
          mkdir -p reports
          set -o pipefail
          python checks/live_opt_in_check.py 2>&1 | tee reports/opt-in.log
          python checks/report_identity_check.py 2>&1 | tee reports/identity.log
          python verify.py --report reports/fast.json --log reports/fast.log 2>&1 | tee reports/fast.stdout.log
      - name: upload fast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: fail if fast gate failed
        if: steps.gate.outcome != 'success'
        run: |
          echo "fast gate failed; see the verify report comment"
          exit 1

  live:
    name: live gate (real api)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_live == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run live gate
        id: gate
        env:
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
        run: |
          mkdir -p reports
          set +e
          python verify_live.py --report reports/live.json > reports/live.stdout.log 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 40 reports/live.stdout.log || true
          exit 0
      - name: upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: leave an external heartbeat
        # Historical schedule-only path retained, but live is now manual-only.
        # No new heartbeat is fabricated while automatic live monitoring is inactive.
        if: always() && github.event_name == 'schedule'
        env:
          LIVE_CODE: ${{ steps.gate.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os
          code = os.environ.get("LIVE_CODE") or ""
          status = {"0": "ok", "1": "drift", "78": "unconfirmed"}.get(code, "unknown")
          report = {}
          try:
              with open("reports/live.json", encoding="utf-8") as fh:
                  report = json.load(fh)
          except Exception:
              pass
          evidence = report.get("evidence") or {}
          payload = {
              "checked_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "trigger": "schedule",
              "exit_code": code,
              "status": status,
              "checks_passed": report.get("checks_passed"),
              "checks_run": report.get("checks_run"),
              "response_id": evidence.get("response_id"),
              "attempted_request": evidence.get("attempted_request"),
              "run_url": os.environ["RUN_URL"],
              "note": "Written only by the daily scheduled run. If checked_at is more than ~48h old, the cron is not running, whatever the repo looks like.",
          }
          with open(".github/live-heartbeat.json", "w", encoding="utf-8") as fh:
              fh.write(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/live-heartbeat.json
          git commit -m "chore: daily live gate heartbeat [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "heartbeat landed on attempt $attempt"
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "the heartbeat never landed; this is fatal"
          exit 1
      - name: classify live outcome
        if: always()
        run: |
          code="${{ steps.gate.outputs.code }}"
          echo "live gate exit code: $code"
          if [ "$code" = "0" ]; then
            echo "live gate: real response matched the contract"
            exit 0
          fi
          if [ "$code" = "78" ]; then
            echo "live gate: unconfirmed. this is not a pass, nothing real was verified"
            exit 0
          fi
          echo "live gate: contract drift or invalid result"
          exit 1

  report:
    name: report
    needs: [fast, live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: download reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: incoming
      - name: decide whether the live gate was supposed to run
        id: expect
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_LIVE: ${{ inputs.run_live }}
        run: |
          set -euo pipefail
          expected=false
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$RUN_LIVE" = 'true' ]; then
            expected=true
          fi
          echo "live=$expected" >> "$GITHUB_OUTPUT"
          echo "live gate expected to run: $expected (manual opt-in only)"
      - name: write back report
        id: writeback
        uses: actions/github-script@v7
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          LIVE_RESULT: ${{ needs.live.result }}
          LIVE_EXPECTED: ${{ steps.expect.outputs.live }}
        with:
          retries: 3
          script: |
            const fs=require('fs');
            const {belongsToRun,consistentLive,selectOwned,assertWritten,selfTest}=require(process.env.GITHUB_WORKSPACE+'/.github/report-policy.cjs');
            const {validateFast,assertIssue,selfTest:fastTests}=require(process.env.GITHUB_WORKSPACE+'/.github/fast-policy.cjs');
            const policyChecks=selfTest(), fastChecks=fastTests();
            const MARKER='<!-- meetnote-verify-report -->', ISSUE_MARKER='<!-- meetnote-live-contract-alert -->';
            const {owner,repo}=context.repo;
            const sha=context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            const expectedRun={repository:owner+'/'+repo,sha:context.sha,run_id:String(context.runId),run_attempt:process.env.GITHUB_RUN_ATTEMPT,event_name:context.eventName};
            const repoApi=process.env.GITHUB_API_URL+'/repos/'+owner+'/'+repo;
            const runUrl=process.env.GITHUB_SERVER_URL+'/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const liveExpected=process.env.LIVE_EXPECTED==='true',liveResult=process.env.LIVE_RESULT,isSchedule=context.eventName==='schedule' && liveExpected;
            const read=p=>{try{return fs.readFileSync(p,'utf8');}catch{return null;}};
            const readJson=p=>{try{return JSON.parse(read(p));}catch{return null;}};
            const fast=readJson('incoming/fast-report/fast.json'),live=readJson('incoming/live-report/live.json');
            const fastProblems=validateFast(fast,expectedRun),liveCurrent=belongsToRun(live,expectedRun);
            core.setOutput('live_state',liveCurrent?live.status:'invalid');
            const fastLog=read('incoming/fast-report/fast.log')||read('incoming/fast-report/fast.stdout.log');
            const identityLog=read('incoming/fast-report/identity.log'),liveLog=read('incoming/live-report/live.stdout.log');
            const optInLog=read('incoming/fast-report/opt-in.log');
            function canCloseAlert(r, job) {
              if (!belongsToRun(r, expectedRun)) return false;
              if (!r || typeof r !== 'object' || Array.isArray(r) || job !== 'success') return false;
              if (r.status !== 'ok' || r.exit_code !== 0) return false;
              if (!Array.isArray(r.drift) || r.drift.length || !Array.isArray(r.unconfirmed_reasons) || r.unconfirmed_reasons.length) return false;
              if (!Array.isArray(r.checks) || !r.checks.length || !Number.isInteger(r.checks_run) || !Number.isInteger(r.checks_passed)) return false;
              if (r.checks_run !== r.checks.length || r.checks_passed !== r.checks.length) return false;
              if (!r.checks.every(c => c && typeof c.id === 'string' && c.id.length && c.ok === true)) return false;
              const ids = new Set(r.checks.map(c => c.id));
              const required = ['stub_channel_absent', 'contract_not_emptied', 'endpoint_is_real', 'transport_is_real', 'key_absent_from_repo', 'request_contract_accepted', 'envelope_is_json', 'envelope_matches_contract', 'response_is_not_a_recording', 'content_matches_schema', 'nonce_echoed_by_model', 'probe_yielded_extractions'];
              if (ids.size !== r.checks.length || !required.every(id => ids.has(id))) return false;
              const e = r.evidence;
              return Boolean(e && e.attempted_request === true && typeof e.response_id === 'string' && e.response_id.length && !e.response_id.startsWith('fixture-'));
            }
            const checkIds=['stub_channel_absent','contract_not_emptied','endpoint_is_real','transport_is_real','key_absent_from_repo','request_contract_accepted','envelope_is_json','envelope_matches_contract','response_is_not_a_recording','content_matches_schema','nonce_echoed_by_model','probe_yielded_extractions'];
            const good={run_identity:{...expectedRun},status:'ok',exit_code:0,drift:[],unconfirmed_reasons:[],checks_run:12,checks_passed:12,checks:checkIds.map(id=>({id,ok:true})),evidence:{attempted_request:true,response_id:'live-selftest'}};
            const cases=[[good,'success',true],[null,'success',false],[{...good,status:'unconfirmed'},'success',false],[{...good,status:'drift'},'success',false],[good,'failure',false],[{...good,checks:[],checks_run:0,checks_passed:0},'success',false],[{...good,checks_passed:11},'success',false],[{...good,exit_code:'0'},'success',false],[{...good,evidence:{attempted_request:false}},'success',false],[{...good,checks:good.checks.map((c,i)=>i?c:{...c,ok:'true'})},'success',false],[{...good,checks:good.checks.map((c,i)=>i?c:{id:'unrelated',ok:true})},'success',false],[{...good,unconfirmed_reasons:['blocked']},'success',false],[{...good,checks:good.checks.map((c,i)=>i?c:good.checks[1])},'success',false],[{...good,run_identity:null},'success',false],[{...good,run_identity:{...expectedRun,run_attempt:String(Number(expectedRun.run_attempt)+1)}},'success',false]];
            for(const [r,j,w] of cases)if(canCloseAlert(r,j)!==w)throw Error('recovery guard self-test failed');
            const L=[MARKER,'## meetnote verify','', 'commit `'+sha.slice(0,7)+'` | execution `'+context.sha+'` | run `'+context.runId+'` | attempt `'+expectedRun.run_attempt+'` | [run]('+runUrl+')',
              'report policy '+policyChecks+'/'+policyChecks+' | fast/alert '+fastChecks+'/'+fastChecks+' | recovery '+cases.length+'/'+cases.length,
              'fast job **'+process.env.FAST_RESULT+'** | live job **'+liveResult+'**',''];
            if(optInLog)L.push('<details><summary>Manual opt-in policy tests</summary>','','~~~',optInLog.slice(-5000),'~~~','</details>');
            if(fastProblems.length){L.push('### fast gate: 报告缺失、损坏或身份不符',...fastProblems.map(x=>'- '+x));}
            else {L.push('### fast gate: `'+fast.status+'` '+fast.checks_passed+'/'+fast.checks_run+' (expected '+fast.expected_checks+')', '快报告运行身份、模块计数、失败计数已核对。'); for(const h of fast.hard_errors)L.push('- hard: '+h);for(const f of fast.failures)L.push('- '+f.test+'\n~~~\n'+f.summary+'\n~~~');}
            if(identityLog)L.push('<details><summary>Producer identity tests</summary>','', '~~~',identityLog.slice(-5000),'~~~','</details>');
            if(fastProblems.length&&fastLog)L.push('~~~',fastLog.slice(-5000),'~~~');
            if(!liveExpected&&liveResult==='skipped')L.push('### live gate: 功能暂不使用，自动真实接口测试已停用；本轮没有调用 StepFun，真实响应没有被验证。历史告警和心跳保留，不表示恢复。');
            else if(!liveCurrent){L.push('### live gate: '+(!live?'报告缺失或 JSON 损坏':!consistentLive(live)?'报告结构、计数或状态矛盾':'报告运行身份不符'), '本轮真实响应没有被验证；不会修改告警状态。');if(liveLog)L.push('~~~',liveLog.slice(-5000),'~~~');}
            else {const e=live.evidence;L.push('### live gate: `'+live.status+'` '+live.checks_passed+'/'+live.checks_run,
              '真实请求 `'+e.attempted_request+'` | 尝试 `'+String(e.attempts??0)+'` | 响应 id `'+String(e.response_id??'not verified')+'`',
              ...live.drift.map(d=>'- drift: '+d),...live.unconfirmed_reasons.map(u=>'- unconfirmed: '+u));
              if(live.status==='unconfirmed')L.push('以上检查数不等于真实响应验证通过；本次恢复未确认。');}
            if(isSchedule)L.push('心跳是否送达须独立读回 `.github/live-heartbeat.json`，不由事件类型推定。');
            const body=L.join('\n');
            async function upsertIssueComment(issueNumber){
              const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:issueNumber,per_page:100});
              const existing=selectOwned(comments,MARKER,c=>c.issue_url===repoApi+'/issues/'+issueNumber);
              if(existing){await github.rest.issues.updateComment({owner,repo,comment_id:existing.id,body});return existing.id;}
              return (await github.rest.issues.createComment({owner,repo,issue_number:issueNumber,body})).data.id;
            }
            async function upsertCommitComment(){
              const comments=await github.paginate(github.rest.repos.listCommentsForCommit,{owner,repo,commit_sha:sha,per_page:100});
              const existing=selectOwned(comments,MARKER,c=>c.commit_id===sha);
              if(existing){await github.rest.repos.updateCommitComment({owner,repo,comment_id:existing.id,body});return existing.id;}
              return (await github.rest.repos.createCommitComment({owner,repo,commit_sha:sha,body})).data.id;
            }
            // ANTI-CLOBBER: PR events alone own PR comments; push/schedule own commit comments.
            const issueNumber = context.payload.pull_request ? context.payload.pull_request.number : null;
            const issues=isSchedule?await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'all',per_page:100}):[];
            const tracker=selectOwned(issues,ISSUE_MARKER,i=>!i.pull_request&&i.repository_url===repoApi);
            const id=issueNumber?await upsertIssueComment(issueNumber):await upsertCommitComment();
            if(!id)throw Error('no comment id');
            const check=issueNumber?await github.rest.issues.getComment({owner,repo,comment_id:id}):await github.rest.repos.getCommitComment({owner,repo,comment_id:id});
            assertWritten(check.data,id,body,c=>issueNumber?c.issue_url===repoApi+'/issues/'+issueNumber:c.commit_id===sha);
            if(fastProblems.length||(liveExpected&&!liveCurrent))core.setFailed('Report validation failed; see precise reasons in the posted report.');
            if(!isSchedule||!liveCurrent||fastProblems.length)return;
            const issueBody=[ISSUE_MARKER,'Daily live contract result. Close only on verified current recovery.','',body].join('\n');
            async function readIssue(number,state){const item=(await github.rest.issues.get({owner,repo,issue_number:number})).data;assertIssue(item,number,issueBody,state,repoApi);}
            if(live.status==='drift'){
              const title='live contract drift: StepFun response contract mismatch';
              if(tracker){await github.rest.issues.update({ owner, repo, issue_number:tracker.number,title,body:issueBody,state: 'open' });await readIssue(tracker.number,'open');}
              else {const created=await github.rest.issues.create({ owner, repo,title,body:issueBody });await readIssue(created.data.number,'open');}
            }else if(tracker&&tracker.state==='open'&&canCloseAlert(live,liveResult)){
              await github.rest.issues.update({ owner, repo,issue_number:tracker.number,body:issueBody,state: 'closed' });await readIssue(tracker.number,'closed');
            }else if(tracker&&tracker.state==='open')core.warning('Keeping alert open: recovery not verified.');
      - name: confirm writeback reached a comment
        if: steps.writeback.outcome != 'success'
        run: |
          echo "report delivery or validation failed; see the current report if present"
          exit 1
      - name: verdict
        env:
          LIVE_STATE: ${{ steps.writeback.outputs.live_state }}
        run: |
          fast="${{ needs.fast.result }}"
          live="${{ needs.live.result }}"
          expected="${{ steps.expect.outputs.live }}"
          if [ "$fast" != "success" ]; then exit 1; fi
          if [ "$expected" = "true" ]; then
            if [ "$live" != "success" ]; then exit 1; fi
            if [ "$LIVE_STATE" = "unconfirmed" ]; then
              echo "execution complete, real response UNCONFIRMED, not recovery"
              exit 0
            fi
            if [ "$LIVE_STATE" != "ok" ]; then exit 1; fi
            echo "current live report ok; recovery still requires positive evidence"
            exit 0
          fi
          if [ "$live" != "skipped" ]; then
            echo "trigger policy no longer matches the docs"
            exit 1
          fi
          echo "live skipped on purpose; real response not verified"
