name: verify

# Response-structure drift is time driven, not commit driven: upstream can change
# the envelope on a day nobody pushes anything. So the live gate is triggered by
# a clock as well as by code, and it is deliberately NOT run on every feature
# branch push.
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Daily. Off the hour on purpose: cron at :00 is the most congested slot and
    # GitHub delays those runs the most.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # The event name is part of the group so a scheduled drift check never queues
  # behind a push, and vice versa: on schedule github.ref is also refs/heads/main.
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  fast:
    name: fast gate (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run fast gate
        id: gate
        continue-on-error: true
        run: |
          mkdir -p reports
          # pipefail is not on by default: without it bash would report tee's exit
          # code and a failing gate would look green.
          set -o pipefail
          python verify.py --report reports/fast.json --log reports/fast.log 2>&1 | tee reports/fast.stdout.log
      - name: upload fast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: fail if fast gate failed
        if: steps.gate.outcome != 'success'
        run: |
          echo "fast gate failed; see the verify report comment"
          exit 1

  live:
    name: live gate (real api)
    # PRs, main, the daily clock, and manual runs. Feature-branch pushes skip it:
    # the fast gate already covers our own parser, and a real API call per push
    # buys nothing the daily run does not already cover.
    # The report job asserts this skip was intentional, so a typo here cannot
    # quietly switch off the only drift detector we have.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run live gate
        id: gate
        env:
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
        run: |
          mkdir -p reports
          set +e
          python verify_live.py --report reports/live.json > reports/live.stdout.log 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 40 reports/live.stdout.log || true
          exit 0
      - name: upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: leave an external heartbeat
        # Why this step exists: GitHub silently disables scheduled workflows after
        # 60 days of repository inactivity, and a disabled cron leaves this file
        # completely untouched. So "the cron is still declared in the YAML" is an
        # empty assertion for the exact failure it appears to guard, and nothing
        # inside CI can catch it either: the guard would have to run on the cron
        # that already stopped running.
        # A dated heartbeat committed by the run itself is a positive trace that
        # can only exist if the run really happened. Something outside the repo
        # compares checked_at against today; stale means the daily drift check is
        # dead, however green the repo looks. Runs on always() so an outage or a
        # drift still proves the schedule is alive.
        if: always() && github.event_name == 'schedule'
        env:
          LIVE_CODE: ${{ steps.gate.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os

          code = os.environ.get("LIVE_CODE") or ""
          status = {"0": "ok", "1": "drift", "78": "unconfirmed"}.get(code, "unknown")
          report = {}
          try:
              with open("reports/live.json", encoding="utf-8") as fh:
                  report = json.load(fh)
          except Exception:
              pass
          evidence = report.get("evidence") or {}
          payload = {
              "checked_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "trigger": "schedule",
              "exit_code": code,
              "status": status,
              "checks_passed": report.get("checks_passed"),
              "checks_run": report.get("checks_run"),
              "response_id": evidence.get("response_id"),
              "attempted_request": evidence.get("attempted_request"),
              "run_url": os.environ["RUN_URL"],
              "note": "Written only by the daily scheduled run. If checked_at is more than ~48h old, the cron is not running, whatever the repo looks like.",
          }
          with open(".github/live-heartbeat.json", "w", encoding="utf-8") as fh:
              fh.write(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/live-heartbeat.json
          # [skip ci] is load bearing. This commit lands on main, a push to main
          # runs the live gate, and that would write another heartbeat, forever,
          # at one real API call per lap.
          git commit -m "chore: daily live gate heartbeat [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "heartbeat landed on attempt $attempt"
              exit 0
            fi
            echo "push failed; rebasing on main and retrying"
            git pull --rebase origin main
          done
          echo "the heartbeat never landed. an outside auditor would read a stale file and cannot tell that apart from a dead cron, so this is fatal"
          exit 1
      - name: classify live outcome
        if: always()
        run: |
          code="${{ steps.gate.outputs.code }}"
          echo "live gate exit code: $code"
          if [ "$code" = "0" ]; then
            echo "live gate: real response matched the contract"
            exit 0
          fi
          if [ "$code" = "78" ]; then
            echo "live gate: unconfirmed (no secret, or the api was unavailable). this is not a pass, nothing real was verified"
            exit 0
          fi
          echo "live gate: the real response contract drifted, or a replay guard failed"
          exit 1

  report:
    name: report
    needs: [fast, live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: download reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: incoming
      - name: decide whether the live gate was supposed to run
        id: expect
        run: |
          event="${{ github.event_name }}"
          ref="${{ github.ref }}"
          expected=false
          case "$event" in
            pull_request|schedule|workflow_dispatch) expected=true ;;
            push) if [ "$ref" = "refs/heads/main" ]; then expected=true; fi ;;
          esac
          echo "live=$expected" >> "$GITHUB_OUTPUT"
          echo "live gate expected to run: $expected (event=$event ref=$ref)"
      - name: write back report
        id: writeback
        uses: actions/github-script@v7
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          LIVE_RESULT: ${{ needs.live.result }}
          LIVE_EXPECTED: ${{ steps.expect.outputs.live }}
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const MARKER = '<!-- meetnote-verify-report -->';
            const ISSUE_MARKER = '<!-- meetnote-live-contract-alert -->';
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            const liveExpected = process.env.LIVE_EXPECTED === 'true';
            const liveResult = process.env.LIVE_RESULT;
            const isSchedule = context.eventName === 'schedule';
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;

            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch (e) { return null; } };
            const readJson = (p) => { const t = read(p); if (!t) { return null; } try { return JSON.parse(t); } catch (e) { return null; } };

            const fast = readJson('incoming/fast-report/fast.json');
            const live = readJson('incoming/live-report/live.json');
            const fastLog = read('incoming/fast-report/fast.log') || read('incoming/fast-report/fast.stdout.log');
            const liveLog = read('incoming/live-report/live.stdout.log');

            const L = [MARKER, '## meetnote verify', ''];
            L.push('commit `' + sha.slice(0, 7) + '` | trigger `' + context.eventName + '` | ' + new Date().toISOString() + ' | [run](' + runUrl + ')');
            L.push('fast job **' + process.env.FAST_RESULT + '** | live job **' + liveResult + '**');
            L.push('');

            if (!fast) {
              L.push('### fast gate: 报告没送到');
              L.push('离线闸门没有产出报告，这一轮当作没跑。');
              if (fastLog) { L.push(''); L.push('```'); L.push(fastLog.split('\n').slice(-25).join('\n')); L.push('```'); }
            } else {
              L.push('### fast gate: `' + fast.status + '` — ' + fast.checks_passed + '/' + fast.checks_run + ' 条通过（应为 ' + fast.expected_checks + ' 条，' + fast.duration_s + 's）');
              for (const h of (fast.hard_errors || [])) { L.push('- **hard**: `' + h + '`'); }
              const fails = fast.failures || [];
              if (fails.length) {
                L.push('');
                L.push('<details><summary>失败明细 ' + fails.length + ' 条</summary>');
                L.push('');
                for (const f of fails.slice(0, 10)) {
                  L.push('**' + f.test + '**');
                  L.push('');
                  L.push('```');
                  L.push(f.summary);
                  L.push('```');
                }
                L.push('</details>');
              }
            }

            L.push('');
            if (!liveExpected && liveResult === 'skipped') {
              // Saying nothing here would let a green comment read as if drift had
              // been checked. It was not.
              L.push('### live gate: 本轮没跑（分支推送不触发慢闸门）');
              L.push('真实响应结构这一轮**没有被验证**。漂移检查跟 PR / 主干 / 每日定时走，不跟分支推送走。');
            } else if (!live) {
              L.push('### live gate: 报告没送到');
              L.push('慢闸门没有产出报告，真实响应结构这一轮没有被验证。');
              if (liveLog) { L.push(''); L.push('```'); L.push(liveLog.split('\n').slice(-20).join('\n')); L.push('```'); }
            } else {
              const e = live.evidence || {};
              L.push('### live gate: `' + live.status + '` — ' + live.checks_passed + '/' + live.checks_run + ' 条通过');
              L.push('- 打了真实请求: `' + String(e.attempted_request) + '` | 尝试 `' + String(e.attempts) + '` 次 | 耗时 `' + String(e.elapsed_ms) + 'ms`');
              L.push('- 响应 id `' + String(e.response_id) + '`（已知录音 id ' + String(e.fixture_ids_known) + ' 个）| 抽取计数 `' + JSON.stringify(e.counts || null) + '`');
              if (e.envelope_additions && e.envelope_additions.length) { L.push('- 新增字段（只报告，不判红）: `' + e.envelope_additions.join(', ') + '`'); }
              for (const d of (live.drift || [])) { L.push('- **drift**: `' + d + '`'); }
              for (const u of (live.unconfirmed_reasons || [])) { L.push('- unconfirmed: `' + u + '`'); }
              const bad = (live.checks || []).filter((c) => !c.ok);
              if (bad.length) {
                L.push('');
                L.push('<details><summary>未通过的检查 ' + bad.length + ' 条</summary>');
                L.push('');
                for (const c of bad) { L.push('- `' + c.id + '`: ' + c.detail); }
                L.push('</details>');
              }
            }

            if (isSchedule) {
              L.push('');
              L.push('心跳已写回 `.github/live-heartbeat.json`,外部审计靠它的时间戳判断这条定时任务还活着。');
            }

            const body = L.join('\n');

            async function upsertIssueComment(issueNumber) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                return existing.id;
              }
              const created = await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
              return created.data.id;
            }

            async function upsertCommitComment() {
              const comments = await github.paginate(github.rest.repos.listCommentsForCommit, { owner, repo, commit_sha: sha, per_page: 100 });
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));
              if (existing) {
                await github.rest.repos.updateCommitComment({ owner, repo, comment_id: existing.id, body });
                return existing.id;
              }
              const created = await github.rest.repos.createCommitComment({ owner, repo, commit_sha: sha, body });
              return created.data.id;
            }

            // ANTI-CLOBBER: one destination, one owner. Pushing to a branch with an
            // open PR fires BOTH a push run and a pull_request run for the same
            // commit. The push run skips the live gate, so if it also wrote to the
            // marked PR comment it could land second and overwrite the full report
            // with "live gate did not run". So the PR comment belongs to
            // pull_request runs only; push and schedule runs own the commit comment.
            const issueNumber = context.payload.pull_request ? context.payload.pull_request.number : null;

            let id = null;
            let where = '';
            if (issueNumber) {
              id = await upsertIssueComment(issueNumber);
              where = 'pr#' + issueNumber;
            } else {
              id = await upsertCommitComment();
              where = 'commit ' + sha.slice(0, 7);
            }
            if (!id) { throw new Error('writeback produced no comment id'); }

            const check = issueNumber
              ? await github.rest.issues.getComment({ owner, repo, comment_id: id })
              : await github.rest.repos.getCommitComment({ owner, repo, comment_id: id });
            if (!check.data.body || !check.data.body.includes(MARKER)) {
              throw new Error('readback failed: the report comment is not there');
            }
            core.info('report written to ' + where + ' comment ' + id);

            // A scheduled run has no PR, and its commit comment lands on a main SHA
            // that may not have moved in a week. Nobody reads that. So drift found
            // by the clock is escalated to an issue, and the issue is closed again
            // once the contract is back.
            if (!isSchedule) { return; }
            const drifted = Boolean(live) && live.status === 'drift';
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const tracker = issues.find((i) => !i.pull_request && i.body && i.body.includes(ISSUE_MARKER)) || null;
            const issueBody = [ISSUE_MARKER, '每日慢闸门的结论。这条 issue 由 CI 维护：漂移时打开，恢复后自动关闭。', '', body].join('\n');

            if (drifted) {
              const title = 'live contract drift: StepFun 响应结构和我们的契约不一致';
              if (tracker) {
                await github.rest.issues.update({ owner, repo, issue_number: tracker.number, title, body: issueBody, state: 'open' });
                core.info('reopened drift issue #' + tracker.number);
              } else {
                const created = await github.rest.issues.create({ owner, repo, title, body: issueBody });
                core.info('opened drift issue #' + created.data.number);
              }
            } else if (tracker && tracker.state === 'open') {
              await github.rest.issues.update({ owner, repo, issue_number: tracker.number, body: issueBody, state: 'closed' });
              core.info('closed drift issue #' + tracker.number + ': the contract is back');
            }
      - name: confirm writeback reached a comment
        if: steps.writeback.outcome != 'success'
        run: |
          echo "the report never reached a comment, so nobody can read this run. treating it as not run"
          exit 1
      - name: verdict
        run: |
          fast="${{ needs.fast.result }}"
          live="${{ needs.live.result }}"
          expected="${{ steps.expect.outputs.live }}"
          echo "fast=$fast live=$live live_expected=$expected event=${{ github.event_name }}"
          if [ "$fast" != "success" ]; then
            echo "fast gate did not pass"
            exit 1
          fi
          if [ "$expected" = "true" ]; then
            if [ "$live" != "success" ]; then
              echo "the live gate was supposed to run here and did not pass"
              exit 1
            fi
            echo "all gates green"
            exit 0
          fi
          # A skip is only acceptable because we predicted it. Any other outcome
          # means the job condition stopped matching the documented policy, and a
          # drift detector that quietly stops running is the single failure that
          # hides itself: everything stays green forever.
          if [ "$live" != "skipped" ]; then
            echo "the live gate was expected to be skipped but reported '$live'; the trigger policy no longer matches the docs"
            exit 1
          fi
          echo "live gate skipped on purpose (feature branch push). real response drift was NOT checked this round"
