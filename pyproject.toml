[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetnote"
version = "0.1.0"
description = "把会议记录文本抽成结构化 JSON"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
meetnote = "meetnote.cli:main"

[tool.setuptools]
packages = ["meetnote"]
